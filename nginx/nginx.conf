# nginx/nginx.conf — TLS-terminating reverse proxy in front of gunicorn
#
# Included inside nginx's http {} block (conf.d/default.conf).
# The Flask app already sets CSP/HSTS/X-Frame-Options etc., so they are
# not duplicated here.

server_tokens off;   # Don't advertise the nginx version

# Edge rate limit (the app has its own per-route limits too)
limit_req_zone $binary_remote_addr zone=perip:10m rate=10r/s;

upstream flask_app {
    server web:5001;
}

# HTTP → HTTPS redirect
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_tickets off;

    client_max_body_size 1m;   # Request buffering / upload cap

    location = / {
        return 302 /login;
    }

    location / {
        limit_req zone=perip burst=20 nodelay;

        proxy_pass http://flask_app;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
