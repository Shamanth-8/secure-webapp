# .github/workflows/sast.yml
#
# SAST — Static Application Security Testing
#
# WHY SAST IN CI/CD:
#   SAST tools analyse source code WITHOUT running it, catching security bugs
#   at commit time — before they reach staging or production.
#   This is "shift-left" security: finding bugs when they're cheapest to fix.
#
# TOOLS USED:
#   Bandit  — Python-specific SAST. Finds: hardcoded passwords, shell injection,
#             SQL injection, weak crypto, insecure random, etc.
#   pip-audit — Checks pinned dependencies against the PyPI advisory database
#   Gitleaks  — Scans git history for committed secrets
#
# PIPELINE FLOW:
#   Push → Bandit scan → pip-audit → Gitleaks → Upload SARIF to GitHub Security tab
#
# Reading the results:
#   Bandit assigns each finding a severity (LOW/MEDIUM/HIGH) and confidence
#   (LOW/MEDIUM/HIGH). A HIGH severity + HIGH confidence finding is a real bug.

name: SAST Security Scan

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  # Allow manual trigger
  workflow_dispatch:

permissions:
  contents: read
  security-events: write   # needed to upload SARIF to the Security tab

jobs:
  bandit-scan:
    name: Bandit SAST (Python)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install security tools
        run: |
          pip install bandit[toml]==1.7.9 bandit-sarif-formatter==1.1.1

      # ----------------------------------------------------------------
      # Scan the VULNERABLE app — we EXPECT findings here (it's intentional)
      # This is educational: see what Bandit catches vs. what it misses
      # ----------------------------------------------------------------
      - name: Bandit scan — vulnerable app
        run: |
          echo "=== SCANNING VULNERABLE APP (expect findings) ==="
          bandit --recursive --severity-level low --confidence-level low \
            vulnerable_app/ || true   # Don't fail pipeline for the vulnerable app

      # ----------------------------------------------------------------
      # Scan the SECURE app — any HIGH severity finding fails the build
      # ----------------------------------------------------------------
      - name: Bandit scan — secure app (strict)
        run: |
          echo "=== SCANNING SECURE APP (zero high-severity tolerance) ==="
          bandit --recursive --severity-level high --confidence-level medium \
            secure_app/

      # ----------------------------------------------------------------
      # Generate SARIF report for GitHub Security tab
      # SARIF = Static Analysis Results Interchange Format
      # GitHub displays SARIF findings in the Security → Code Scanning tab
      # ----------------------------------------------------------------
      - name: Bandit scan — generate SARIF
        if: always()
        run: |
          bandit --recursive --format sarif --output bandit-results.sarif \
            secure_app/ || true

      - name: Upload SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: bandit-results.sarif
          category: bandit

  dependency-check:
    name: Dependency Vulnerability Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pip-audit
        run: pip install pip-audit==2.7.3

      # pip-audit checks pinned packages against the PyPI advisory database.
      # The second run fails the job if any known CVE is present.
      - name: Audit dependencies
        run: |
          pip-audit -r requirements.txt --desc --format json --output pip-audit-results.json || true
          pip-audit -r requirements.txt --desc

      - name: Upload audit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit-results
          path: pip-audit-results.json

  tests:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run pytest
        run: |
          pip install -r requirements.txt
          pytest tests/ -q

  secret-scan:
    name: Secret Detection
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # Full history for git log scanning

      # Gitleaks scans git history for accidentally committed secrets
      # (API keys, passwords, tokens, private keys)
      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true   # Don't block on the intentional "password" in vulnerable_app
