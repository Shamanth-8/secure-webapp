{% extends "base.html" %}
{% block title %}Note{% endblock %}
{% block content %}
<div class="container">
  <div class="card" style="margin-top:2rem">
    <h2>📝 Note #{{ note.id }}</h2>
    <p style="font-size:0.9rem;line-height:1.7">{{ note.content }}</p>
    <div style="margin-top:1rem"><a href="{{ url_for('dashboard') }}" style="color:#6f42c1;font-size:0.85rem">← Back</a></div>
  </div>
</div>
{% endblock %}
