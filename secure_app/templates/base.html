<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Secure App{% endblock %}</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', system-ui, sans-serif; background: #f0f2f5; color: #1a1a2e; font-size: 15px; }
    nav { background: #1a1a2e; padding: 0.9rem 2rem; display: flex; justify-content: space-between; align-items: center; }
    nav a { color: #8be9fd; text-decoration: none; font-size: 0.85rem; margin-left: 1.25rem; }
    nav a:hover { color: #fff; }
    nav .brand { color: #fff; font-weight: 700; font-size: 1rem; margin-left: 0; }
    .container { max-width: 520px; margin: 3rem auto; padding: 0 1rem; }
    .card { background: #fff; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); padding: 2rem; }
    h2 { font-size: 1.2rem; margin-bottom: 1.5rem; color: #1a1a2e; }
    label { display: block; font-size: 0.8rem; font-weight: 600; color: #495057; margin-bottom: 0.3rem; text-transform: uppercase; letter-spacing: 0.04em; }
    input[type=text], input[type=password], textarea {
      width: 100%; padding: 0.6rem 0.85rem; border: 1px solid #dee2e6;
      border-radius: 6px; font-size: 0.9rem; margin-bottom: 1rem;
      transition: border-color 0.15s;
    }
    input:focus, textarea:focus { outline: none; border-color: #6f42c1; box-shadow: 0 0 0 3px rgba(111,66,193,0.15); }
    .btn { display: inline-block; padding: 0.6rem 1.5rem; border: none; border-radius: 6px; font-size: 0.9rem; font-weight: 600; cursor: pointer; }
    .btn-primary { background: #1a1a2e; color: #fff; width: 100%; margin-top: 0.5rem; }
    .btn-primary:hover { background: #2d2d4e; }
    .error { background: #fff0f0; border-left: 3px solid #dc3545; color: #7f1d1d; padding: 0.6rem 0.9rem; border-radius: 0 6px 6px 0; font-size: 0.85rem; margin-bottom: 1rem; }
    .success { background: #f0fff4; border-left: 3px solid #198754; color: #14532d; padding: 0.6rem 0.9rem; border-radius: 0 6px 6px 0; font-size: 0.85rem; margin-bottom: 1rem; }
    .link-row { text-align: center; margin-top: 1rem; font-size: 0.83rem; color: #6c757d; }
    .link-row a { color: #6f42c1; text-decoration: none; }
    table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
    th { background: #1a1a2e; color: #fff; padding: 0.6rem 0.9rem; text-align: left; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; }
    td { padding: 0.55rem 0.9rem; border-bottom: 1px solid #f1f3f5; }
    tr:hover td { background: #f8f9fa; }
    .badge { display: inline-block; font-size: 0.68rem; font-weight: 700; padding: 0.2rem 0.5rem; border-radius: 0.25rem; text-transform: uppercase; }
    .b-admin { background: #6f42c1; color: #fff; }
    .b-user  { background: #0dcaf0; color: #1a1a2e; }
  </style>
</head>
<body>
<nav>
  <a href="{{ url_for('dashboard') }}" class="brand">🔐 SecureApp</a>
  <div>
    {% if session.get('username') %}
      <a href="{{ url_for('dashboard') }}">Dashboard</a>
      <a href="{{ url_for('comment') }}">Comments</a>
      {% if session.get('role') == 'admin' %}
        <a href="{{ url_for('admin') }}">Admin</a>
      {% endif %}
      <a href="{{ url_for('logout') }}">Logout ({{ session.username }})</a>
    {% else %}
      <a href="{{ url_for('login') }}">Login</a>
      <a href="{{ url_for('register') }}">Register</a>
    {% endif %}
  </div>
</nav>
{% block content %}{% endblock %}
</body>
</html>
