{% extends "base.html" %}
{% block title %}Dashboard{% endblock %}
{% block content %}
<div class="container" style="max-width:700px">
  <div class="card" style="margin-top:2rem">
    <h2>👋 Welcome, {{ username }}</h2>
    <p style="color:#6c757d;font-size:0.9rem;margin-bottom:1.5rem">You are securely logged in.</p>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem">
      <a href="{{ url_for('comment') }}" style="text-decoration:none">
        <div style="background:#f8f9fa;border-radius:8px;padding:1.25rem;border-left:3px solid #6f42c1">
          <div style="font-weight:700;margin-bottom:0.25rem">💬 Comments</div>
          <div style="font-size:0.8rem;color:#6c757d">Post and view notes</div>
        </div>
      </a>
      <a href="{{ url_for('ping') }}?host=127.0.0.1" style="text-decoration:none">
        <div style="background:#f8f9fa;border-radius:8px;padding:1.25rem;border-left:3px solid #0dcaf0">
          <div style="font-weight:700;margin-bottom:0.25rem">📡 Ping Tool</div>
          <div style="font-size:0.8rem;color:#6c757d">Network reachability check</div>
        </div>
      </a>
    </div>
  </div>
</div>
{% endblock %}
